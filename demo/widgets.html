<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Widget shapes — demo target for Record</title>
<style>
  :root { --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --bg: #f8fafc; --brand: #2563eb; --ok: #059669; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  main { max-width: 760px; margin: 32px auto 80px; padding: 0 20px; }
  h1 { font-size: 26px; letter-spacing: -.02em; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  fieldset { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin: 0 0 18px; }
  legend { font-weight: 600; padding: 0 6px; }
  label { display: block; font-weight: 500; margin: 12px 0 4px; }
  input, select, textarea, button { font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  button { background: var(--brand); color: #fff; border-color: var(--brand); font-weight: 600; cursor: pointer; }
  /* A date picker is not a text field: its input is readonly and the calendar
     lives behind it. This is the shape that a plain `fill` cannot type into. */
  .picker { position: relative; display: inline-block; }
  .picker input { padding-right: 34px; }
  .picker .cal { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--brand); font-weight: 700; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rows > div { display: flex; gap: 10px; margin-bottom: 8px; }
  .rows input { flex: 1; }
  #log { font: 12px/1.6 ui-monospace, Consolas, monospace; background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 8px; white-space: pre-wrap; min-height: 120px; }
  .ok { color: var(--ok); font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>Widget shapes</h1>
  <p class="sub">The controls that break naive replay: a date picker, a custom dropdown, a field that grows, and a repeating row.</p>

  <fieldset>
    <legend>Date picker</legend>
    <label for="when">Appointment date</label>
    <span class="picker">
      <input id="when" name="when" type="text" readonly placeholder="Pick a date" aria-label="Appointment date" />
      <span class="cal">▾</span>
    </span>
    <div id="calendar" hidden role="dialog" aria-label="Calendar">
      <div><button type="button" data-day="1">1</button><button type="button" data-day="2">2</button><button type="button" data-day="3">3</button></div>
    </div>
  </fieldset>

  <fieldset>
    <legend>Dropdown</legend>
    <label for="region">Region</label>
    <select id="region" name="region" aria-label="Region">
      <option value="">Choose…</option>
      <option value="emea">EMEA</option>
      <option value="apac">APAC</option>
      <option value="amer">AMER</option>
    </select>
  </fieldset>

  <fieldset>
    <legend>Contenteditable</legend>
    <div id="note" contenteditable="true" role="textbox" aria-label="Note" data-placeholder="Write a note…"></div>
  </fieldset>

  <fieldset>
    <legend>Dynamic rows</legend>
    <div class="rows" id="rows">
      <div><input aria-label="Item 1" placeholder="Item 1" /><input aria-label="Qty 1" placeholder="Qty" /></div>
    </div>
    <button type="button" id="add-row">Add row</button>
  </fieldset>

  <fieldset>
    <legend>Submit</legend>
    <button type="button" id="save">Save booking</button>
  </fieldset>

  <h3>Result</h3>
  <div id="log">nothing yet</div>
</main>

<script>
  const log = (line) => {
    const el = document.getElementById('log');
    el.textContent = `${el.textContent}\n${line}`.trim();
  };

  // A readonly input that only a click on a day can change — the exact shape a
  // date picker has, and the one a typed value cannot reach.
  const when = document.getElementById('when');
  const calendar = document.getElementById('calendar');
  when.addEventListener('click', () => { calendar.hidden = !calendar.hidden; });
  document.addEventListener('click', (e) => {
    const day = e.target.closest('[data-day]');
    if (!day) return;
    when.value = `2026-03-${String(day.dataset.day).padStart(2, '0')}`;
    when.dispatchEvent(new Event('change', { bubbles: true }));
    calendar.hidden = true;
    log(`date = ${when.value}`);
  });

  let rows = 1;
  document.getElementById('add-row').addEventListener('click', () => {
    rows += 1;
    const div = document.createElement('div');
    div.innerHTML = `<input aria-label="Item ${rows}" placeholder="Item ${rows}" /><input aria-label="Qty ${rows}" placeholder="Qty" />`;
    document.getElementById('rows').appendChild(div);
    log(`added row ${rows}`);
  });

  document.getElementById('save').addEventListener('click', () => {
    const note = document.getElementById('note').textContent.trim();
    const line = document.createElement('div');
    line.className = 'ok';
    line.textContent = `saved: date=${when.value} region=${document.getElementById('region').value} note=${note} rows=${rows}`;
    log(line.textContent);
  });
</script>
</body>
</html>
