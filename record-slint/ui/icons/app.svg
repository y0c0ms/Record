<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a44"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9db6ff"/>
      <stop offset="1" stop-color="#5a7ef0"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile, the app's dark surface. -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- A replay loop: clockwise from the top, ending in an arrowhead that
       points back toward where it began — what was recorded, played again. -->
  <path d="M128 48A80 80 0 1 1 58.7 88" fill="none" stroke="url(#ring)" stroke-width="18" stroke-linecap="round"/>
  <path d="M71.5 65.9L32 86.3L73.6 110.3Z" fill="#9db6ff" stroke="#9db6ff" stroke-width="4" stroke-linejoin="round"/>
  <!-- The record dot at the centre. -->
  <circle cx="128" cy="128" r="38" fill="#e7545f"/>
  <circle cx="128" cy="128" r="38" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>
</svg>
